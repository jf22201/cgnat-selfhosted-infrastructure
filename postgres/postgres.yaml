services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "${LAN_IP}:5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./${POSTGRES_INIT}:/docker-entrypoint-initdb.d/${POSTGRES_INIT}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - homelab_net
